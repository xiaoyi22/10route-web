<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2b3a; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  svg { width: min(96vw, 1000px); height: auto; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#e3f4ff"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f08a24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="42" fill="#ffe680"/>

  <g id="hills" fill="#9bd38a">
    <path d="M0 340 Q100 270 200 330 T400 320 T600 330 T800 315 T1000 330 T1200 320 T1400 330 T1600 315 V500 H0Z"/>
  </g>
  <g id="clouds" fill="#fff" opacity=".9">
    <g transform="translate(120 90)"><ellipse rx="45" ry="18"/><ellipse cx="30" cy="-10" rx="30" ry="18"/><ellipse cx="-25" cy="-6" rx="25" ry="14"/></g>
    <g transform="translate(450 60)"><ellipse rx="55" ry="20"/><ellipse cx="35" cy="-12" rx="32" ry="20"/></g>
    <g transform="translate(800 120)"><ellipse rx="40" ry="15"/><ellipse cx="-20" cy="-10" rx="28" ry="16"/></g>
    <g transform="translate(1150 80)"><ellipse rx="50" ry="18"/><ellipse cx="25" cy="-12" rx="30" ry="18"/></g>
  </g>

  <rect y="430" width="800" height="70" fill="#6b6b6b"/>
  <rect y="428" width="800" height="5" fill="#4f4f4f"/>
  <line id="roadLine" x1="0" y1="468" x2="800" y2="468" stroke="#f5f5f5" stroke-width="5" stroke-dasharray="40 30"/>

  <g id="rider">
    <ellipse cx="360" cy="434" rx="170" ry="7" fill="rgba(0,0,0,.25)"/>

    <!-- far leg (behind bike) -->
    <g id="legFar" stroke="#d9772b" stroke-width="7" stroke-linecap="round" fill="none">
      <polyline id="legFarPath"/>
      <path id="footFar" fill="#d9772b" stroke="none"/>
    </g>

    <!-- wheels -->
    <g id="wheelRear" transform="translate(250 360)">
      <circle r="70" fill="none" stroke="#222" stroke-width="9"/>
      <circle r="64" fill="none" stroke="#999" stroke-width="2"/>
      <g class="spokes" stroke="#aaa" stroke-width="1.5"></g>
      <circle r="6" fill="#555"/>
    </g>
    <g id="wheelFront" transform="translate(470 360)">
      <circle r="70" fill="none" stroke="#222" stroke-width="9"/>
      <circle r="64" fill="none" stroke="#999" stroke-width="2"/>
      <g class="spokes" stroke="#aaa" stroke-width="1.5"></g>
      <circle r="6" fill="#555"/>
    </g>

    <!-- chain -->
    <g stroke="#444" stroke-width="2.5" fill="none">
      <line x1="345" y1="347" x2="250" y2="350"/>
      <line x1="345" y1="383" x2="250" y2="370"/>
    </g>
    <circle cx="250" cy="360" r="10" fill="none" stroke="#444" stroke-width="3"/>

    <!-- frame -->
    <g stroke="#d6336c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="250,360 345,365 320,255 250,360"/>
      <polyline points="320,255 440,255 345,365"/>
      <line x1="445" y1="235" x2="470" y2="360"/>
    </g>
    <g stroke="#333" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="445" y1="235" x2="452" y2="212"/>
      <path d="M452 212 Q445 205 430 210"/>
      <line x1="320" y1="255" x2="317" y2="240"/>
    </g>
    <path d="M298 238 Q318 230 338 238 Q318 246 298 238Z" fill="#222"/>

    <!-- chainring + crank -->
    <circle cx="345" cy="365" r="18" fill="none" stroke="#555" stroke-width="4"/>
    <g id="crank" stroke="#333" stroke-width="5" stroke-linecap="round">
      <line id="crankArm1"/>
      <line id="crankArm2"/>
    </g>
    <circle cx="345" cy="365" r="5" fill="#333"/>

    <!-- pelican body -->
    <g id="pelican">
      <path d="M268 205 L238 190 L245 210 L232 215 L262 222Z" fill="#e8e8e8" stroke="#bbb" stroke-width="1.5"/>
      <ellipse cx="315" cy="212" rx="62" ry="40" fill="#fafafa" stroke="#ccc" stroke-width="2" transform="rotate(-12 315 212)"/>
      <path d="M350 192 C365 165 360 140 382 125" stroke="#fafafa" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M350 192 C365 165 360 140 382 125" stroke="#ddd" stroke-width="2" fill="none" stroke-dasharray="2 6"/>

      <g id="head">
        <circle cx="388" cy="122" r="20" fill="#fafafa" stroke="#ccc" stroke-width="2"/>
        <path d="M378 104 Q385 92 398 98 Q390 100 388 106Z" fill="#f3d36b"/>
        <!-- pouch -->
        <path id="pouch" d="M398 130 Q440 175 500 138 L402 136Z" fill="#f6a04d" stroke="#d9772b" stroke-width="1.5"/>
        <!-- upper bill -->
        <path d="M398 118 L505 132 Q508 137 500 138 L400 132Z" fill="url(#beakGrad)" stroke="#d9772b" stroke-width="1.5"/>
        <path d="M498 131 Q510 134 503 141" fill="none" stroke="#c0611a" stroke-width="2"/>
        <circle cx="392" cy="116" r="4.5" fill="#222"/>
        <circle cx="393.5" cy="114.5" r="1.4" fill="#fff"/>
      </g>

      <!-- wing reaching to handlebar -->
      <path id="wing" d="M285 200 Q330 175 375 195 Q410 205 432 210 Q405 222 370 222 Q320 232 285 200Z" fill="#e6e6e6" stroke="#bbb" stroke-width="1.5"/>
      <path d="M300 210 Q330 205 360 212 M310 220 Q335 216 355 220" stroke="#bbb" stroke-width="1.5" fill="none"/>
      <path d="M380 215 L392 222 M392 214 L404 221 M404 213 L416 219" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- near leg (in front of bike) -->
    <g id="legNear" stroke="#f08a24" stroke-width="8" stroke-linecap="round" fill="none">
      <polyline id="legNearPath"/>
      <path id="footNear" fill="#f08a24" stroke="none"/>
    </g>
  </g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

document.querySelectorAll('.spokes').forEach(g => {
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x2', (64 * Math.cos(a)).toFixed(1));
    l.setAttribute('y2', (64 * Math.sin(a)).toFixed(1));
    g.appendChild(l);
  }
});

const BB = { x: 345, y: 365 }, CRANK = 26, THIGH = 82, SHIN = 80;

function knee(hip, foot) {
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.01);
  const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
  const ux = dx / d, uy = dy / d;
  const px = hip.x + a * ux, py = hip.y + a * uy;
  const k1 = { x: px - h * uy, y: py + h * ux }, k2 = { x: px + h * uy, y: py - h * ux };
  return k1.x > k2.x ? k1 : k2;
}

function drawLeg(pathEl, footEl, hip, foot) {
  const k = knee(hip, foot);
  pathEl.setAttribute('points', `${hip.x},${hip.y} ${k.x},${k.y} ${foot.x},${foot.y}`);
  footEl.setAttribute('d', `M${foot.x - 8} ${foot.y} L${foot.x + 22} ${foot.y - 4} L${foot.x + 24} ${foot.y + 4} L${foot.x + 10} ${foot.y + 6} Z`);
}

let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; t += dt;

  const crankAngle = t * 5;
  const wheelDeg = (crankAngle * 2.2 * 180 / Math.PI) % 360;
  const speed = 2.2 * 5 * 70;

  $('wheelRear').querySelector('.spokes').setAttribute('transform', `rotate(${wheelDeg})`);
  $('wheelFront').querySelector('.spokes').setAttribute('transform', `rotate(${wheelDeg})`);

  const p1 = { x: BB.x + CRANK * Math.cos(crankAngle), y: BB.y + CRANK * Math.sin(crankAngle) };
  const p2 = { x: BB.x - CRANK * Math.cos(crankAngle), y: BB.y - CRANK * Math.sin(crankAngle) };
  for (const [el, p] of [[$('crankArm1'), p1], [$('crankArm2'), p2]]) {
    el.setAttribute('x1', BB.x); el.setAttribute('y1', BB.y);
    el.setAttribute('x2', p.x); el.setAttribute('y2', p.y);
  }

  const bob = Math.sin(crankAngle * 2) * 2.5;
  $('pelican').setAttribute('transform', `translate(0 ${bob})`);
  $('head').setAttribute('transform', `rotate(${Math.sin(crankAngle) * 4} 375 140)`);
  $('pouch').setAttribute('transform', `translate(0 ${Math.sin(t * 7) * 2})`);

  const hip = { x: 322, y: 236 + bob };
  drawLeg($('legNearPath'), $('footNear'), hip, p1);
  drawLeg($('legFarPath'), $('footFar'), { x: hip.x - 6, y: hip.y }, p2);

  const scroll = t * speed;
  $('roadLine').setAttribute('stroke-dashoffset', scroll % 70);
  $('hills').setAttribute('transform', `translate(${-(scroll * 0.15) % 800} 0)`);
  $('clouds').setAttribute('transform', `translate(${(-(scroll * 0.05) % 1300) + 200} 0)`);
  $('rider').setAttribute('transform', `translate(${Math.sin(t * 0.6) * 15} 0)`);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
